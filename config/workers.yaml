  # Mistral (Vibe) — added post-MVP 0.1, see the Vibe spike (Git history).
  # Priority deliberately below the validated Anthropic/OpenAI pool
  # (100/90): this adds capacity/provider diversity, it never silently
  # displaces an already-validated primary. Only `development` is granted
  # — the spike only produced execution evidence for development-shaped
  # work (autonomous file edit + test run); qa_testing/release_planning/
  # roadmap_synthesis are not granted without evidence.
  # `quota_windows` for this provider are always empty (EXECUTION_PROBE_ONLY,
  # see MistralVibeAdapter) — both workers below share that same
  # provider-level signal, never an independent quota each.
  - worker_id: milo
    display_name: Nathaniel
    enabled: true
    provider: mistral
    backend: vibe
    priority: 60

    capabilities:
      - development

    default_profile_id: standard
    estimator_profile_id: standard

    profiles:
      standard:
        quality_tier: STANDARD
        model: vibe-default
        cost_rank: 20

  - worker_id: juno
    display_name: Juno
    enabled: true
    provider: mistral
    backend: vibe
    priority: 60

    capabilities:
      - development

    default_profile_id: standard
    estimator_profile_id: standard

    profiles:
      standard:
        quality_tier: STANDARD
