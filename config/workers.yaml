# Worker Registry (Slice 15) — declarative, no code changes required to
# add/adjust a worker or its execution profiles. See
# docs/ADAPTIVE_EXECUTION.md sections 4-5 for the design behind this file,
# and src/orchestrator/worker_registry.py for the loader/validator.
#
# No secrets here: authentication stays with the Claude Code / Codex CLIs
# themselves (already logged in outside this project) — never an API key,
# token, or credential in this file.
#
# Model names below are the ones already confirmed in this project's own
# tests/docs (docs/SPIKE_RALPH.md, ralph.yml/ralph-codex.yml in
# ~/projects/ralph-spike) — never invented.
#
# quality_tier: one of SIMPLE, STANDARD, COMPLEX, CRITICAL (see
# orchestrator.worker_selector.QualityTier) — the minimum capability level
# a profile satisfies, used by adaptive selection (Slice 17) to filter out
# profiles too weak for a recommendation, never to rank workers.
#
# cost_rank: a configured, relative economic preference (lower = prefer
# this profile) — never a real provider price, never inferred from model/
# reasoning_effort. profile_id names (economy/standard/deep) are plain
# labels with no special meaning to the engine; cost_rank is what
# adaptive selection (Slice 17) actually reads.

workers:
  - worker_id: alice
    display_name: Alice
    enabled: true
    provider: anthropic
    backend: claude_code
    priority: 100

    capabilities:
      - development
      - code_review
      - release_planning
      - roadmap_synthesis
      - complexity_estimation
      - qa_testing

    default_profile_id: standard
    estimator_profile_id: economy

    profiles:
      economy:
        quality_tier: SIMPLE
        model: haiku
        cost_rank: 10

      standard:
        quality_tier: STANDARD
        model: sonnet
        cost_rank: 20

      deep:
        quality_tier: COMPLEX
        model: sonnet
        cost_rank: 30

  # Worker pool fallback (2026-09-17 product decision): a second,
  # independent worker per participating provider. Same capabilities/
  # profiles as the provider's primary worker — no artificial functional
  # difference. priority=90 (< the primary's 100) so a fresh selection
  # with no author still naturally prefers the primary worker; the
  # priority gap never blocks DEV B/fallback selection, which is governed
  # entirely by WorkerSelector's existing author-exclusion + cross-
  # provider preference (see docs/ADAPTIVE_EXECUTION.md and ROADMAP.md,
  # "Worker pool").
  - worker_id: bob
    display_name: Bob
    enabled: true
    provider: anthropic
    backend: claude_code
    priority: 90

    capabilities:
      - development
      - code_review
      - release_planning
      - roadmap_synthesis
      - complexity_estimation
      - qa_testing

    default_profile_id: standard
    estimator_profile_id: economy

    profiles:
      economy:
        quality_tier: SIMPLE
        model: haiku
        cost_rank: 10

      standard:
        quality_tier: STANDARD
        model: sonnet
        cost_rank: 20

      deep:
        quality_tier: COMPLEX
        model: sonnet
        cost_rank: 30

  - worker_id: victor
    display_name: Victor
    enabled: true
    provider: openai
    backend: codex
    priority: 100

    capabilities:
      - development
      - code_review
      - release_planning
      - roadmap_synthesis
      - complexity_estimation
      - qa_testing

    default_profile_id: standard
    estimator_profile_id: economy

    profiles:
      economy:
        quality_tier: SIMPLE
        model: gpt-5.6-terra
        reasoning_effort: low
        cost_rank: 10

      standard:
        quality_tier: STANDARD
        model: gpt-5.6-terra
        reasoning_effort: medium
        cost_rank: 20

      deep:
        quality_tier: COMPLEX
        model: gpt-5.6-terra
        reasoning_effort: high
        cost_rank: 30

  - worker_id: oscar
    display_name: Oscar
    enabled: true
