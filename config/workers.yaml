        cost_rank: 20

  # Gravity (P19/P20, ROADMAP.md) — `agy` CLI, reusing the exact
  # custom-backend mechanism already proven by Vibe
  # (`gravity_ralph_bridge.py`). Real, verified (P19 Phase A + P20): `agy`
  # 1.2.12, `--mode=accept-edits` alone (no bypass) genuinely
  # non-interactive, `claude-sonnet-4-6` a real, selectable model id
  # (`agy models`) — never a sentinel. No reasoning_effort: `--effort`
  # exists but `agy` itself rejects it for this model. Real quota
  # telemetry via `agy -p "/usage" --output-format json`
  # (`GravityAdapter`) — no longer EXECUTION_PROBE_ONLY (P20 upgraded
  # this once `/usage` was verified real and free of any model turn).
  # `gravity` is the provider/backend identifier, never a worker
  # display_name (P20 product decision) — exactly two human worker
  # identities below, same convention as every other provider
  # (primary=101/secondary=91, mirroring the 100/90 split used
  # elsewhere): Arthur (primary, DEV A-eligible) and Nora (secondary,
  # independent reviewer/fallback). Both share the exact same
  # `GravityAdapter`-probed `ProviderState` — one shared account quota,
  # never a second, independent one per worker.
  - worker_id: gravity_primary
    display_name: Arthur
    enabled: true
    provider: gravity
    backend: gravity
    priority: 101

    capabilities:
      - development

    default_profile_id: standard
    estimator_profile_id: standard

    profiles:
      standard:
        quality_tier: STANDARD
        model: claude-sonnet-4-6
        cost_rank: 20

  - worker_id: gravity_secondary
    display_name: Nora
    enabled: true
    provider: gravity
    backend: gravity
    priority: 91

    capabilities:
      - development

    default_profile_id: standard
    estimator_profile_id: standard

    profiles:
      standard:
        quality_tier: STANDARD
        model: claude-sonnet-4-6
        cost_rank: 20
